name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: khizana-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KHIZANA_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/khizana.jks"

      - name: Build signed release APK
        env:
          KHIZANA_KEYSTORE_FILE: ${{ runner.temp }}/khizana.jks
          KHIZANA_KEYSTORE_PASSWORD: ${{ secrets.KHIZANA_KEYSTORE_PASSWORD }}
          KHIZANA_KEY_ALIAS: ${{ secrets.KHIZANA_KEY_ALIAS }}
          KHIZANA_KEY_PASSWORD: ${{ secrets.KHIZANA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
