name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The wrapper JAR is a binary committed to the repository and CI executes
      # it directly with the signing secrets in reach, so verify it against
      # Gradle's published checksums before anything runs it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Includes the Robolectric-backed Room tests, which used to sit in
      # androidTest and therefore never ran in CI at all.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # A green test task proves nothing on its own: a suite that discovered no
      # tests reports exactly the same success. Print the counts, and fail if
      # nothing ran.
      - name: Unit test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          if not files:
              sys.exit("No test result XML: the unit test suite did not run.")
          total = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
              print(f"  {root.get('name')}: {root.get('tests')} tests")
          print(f"TOTAL {len(files)} classes, {total} tests, "
                f"{failures} failures, {errors} errors, {skipped} skipped")
          if total == 0:
              sys.exit("Test classes were found but no tests executed.")
          PY

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      # R8 only runs for the release build, so a rule that strips something the
      # app needs stayed invisible until a tag was pushed — the one build
      # nobody wants to debug. Unsigned is enough: it is the shrinking that is
      # under test, not the signature.
      - name: Build release APK (unsigned, exercises R8)
        run: ./gradlew assembleRelease --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: khizana-debug
          path: app/build/outputs/apk/debug/*.apk

  # Flags dependencies carrying known high-severity advisories.
  #
  # ADVISORY, and now one setting away from being a gate.
  #
  # It needs two things, and dependency-submission.yml supplies the second:
  # GitHub's dependency graph does not parse Gradle build files, so without a
  # submitted snapshot of main this would compare two empty graphs and pass
  # green having examined nothing.
  #
  # What is still missing is the graph itself. The error the action prints —
  # "Dependency review is not supported on this repository" — links to the
  # repository's Settings -> Code security, but for a repository owned by a
  # user account the governing switch is the ACCOUNT one, at
  # https://github.com/settings/security_analysis ("Dependency graph", which
  # covers every repository the account owns whatever its visibility).
  # Enabling things repository-side left the API still answering "not
  # supported".
  #
  # Until then continue-on-error keeps a permanently-erroring check from
  # walling off every PR — a check that is always red teaches everyone to
  # ignore the one place a genuine advisory would appear. Remove the line once
  # a run's log shows the action actually comparing dependencies, which is also
  # the moment dependency-submission.yml starts succeeding.
  #
  # continue-on-error must sit on the *step*: at job level it keeps the
  # workflow green but the check run itself still reports failure, which is
  # exactly the red wall it is meant to avoid.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high

  release:
    name: Signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The secret travels as an environment variable, not interpolated into
      # the shell command: nothing about it can end up in a command line, a
      # process listing, or a trace. printf rather than echo, so a value
      # starting with a dash is data instead of a flag.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KHIZANA_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/khizana.jks"

      - name: Build signed release APK
        env:
          KHIZANA_KEYSTORE_FILE: ${{ runner.temp }}/khizana.jks
          KHIZANA_KEYSTORE_PASSWORD: ${{ secrets.KHIZANA_KEYSTORE_PASSWORD }}
          KHIZANA_KEY_ALIAS: ${{ secrets.KHIZANA_KEY_ALIAS }}
          KHIZANA_KEY_PASSWORD: ${{ secrets.KHIZANA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
