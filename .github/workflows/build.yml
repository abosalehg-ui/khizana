name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The wrapper JAR is a binary committed to the repository and CI executes
      # it directly with the signing secrets in reach, so verify it against
      # Gradle's published checksums before anything runs it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Includes the Robolectric-backed Room tests, which used to sit in
      # androidTest and therefore never ran in CI at all.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # A green test task proves nothing on its own: a suite that discovered no
      # tests reports exactly the same success. Print the counts, and fail if
      # nothing ran.
      - name: Unit test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          if not files:
              sys.exit("No test result XML: the unit test suite did not run.")
          total = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
              print(f"  {root.get('name')}: {root.get('tests')} tests")
          print(f"TOTAL {len(files)} classes, {total} tests, "
                f"{failures} failures, {errors} errors, {skipped} skipped")
          if total == 0:
              sys.exit("Test classes were found but no tests executed.")
          PY

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      # R8 only runs for the release build, so a rule that strips something the
      # app needs stayed invisible until a tag was pushed — the one build
      # nobody wants to debug. Unsigned is enough: it is the shrinking that is
      # under test, not the signature.
      - name: Build release APK (unsigned, exercises R8)
        run: ./gradlew assembleRelease --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: khizana-debug
          path: app/build/outputs/apk/debug/*.apk

  # Blocks dependencies with known high-severity advisories on every PR.
  #
  # This is a real gate now: the advisory continue-on-error is gone, so a
  # vulnerable dependency fails the check instead of being noted in a log
  # nobody opens.
  #
  # It needs the repository's "Dependency graph" setting to be on
  # (Settings -> Code security). Without it the action fails with "Dependency
  # review is not supported on this repository" — if that is what a red check
  # here says, turn the setting on rather than reinstating continue-on-error.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  release:
    name: Signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The secret travels as an environment variable, not interpolated into
      # the shell command: nothing about it can end up in a command line, a
      # process listing, or a trace. printf rather than echo, so a value
      # starting with a dash is data instead of a flag.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KHIZANA_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/khizana.jks"

      - name: Build signed release APK
        env:
          KHIZANA_KEYSTORE_FILE: ${{ runner.temp }}/khizana.jks
          KHIZANA_KEYSTORE_PASSWORD: ${{ secrets.KHIZANA_KEYSTORE_PASSWORD }}
          KHIZANA_KEY_ALIAS: ${{ secrets.KHIZANA_KEY_ALIAS }}
          KHIZANA_KEY_PASSWORD: ${{ secrets.KHIZANA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
