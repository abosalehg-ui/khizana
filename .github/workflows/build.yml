name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The wrapper JAR is a binary committed to the repository and CI executes
      # it directly with the signing secrets in reach, so verify it against
      # Gradle's published checksums before anything runs it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Includes the Robolectric-backed Room tests, which used to sit in
      # androidTest and therefore never ran in CI at all.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: khizana-debug
          path: app/build/outputs/apk/debug/*.apk

  # Flags dependencies with known high-severity advisories on every PR.
  #
  # Requires the repository's "Dependency graph" setting to be on
  # (Settings -> Code security). Until it is, the action errors out with
  # "Dependency review is not supported on this repository", which is a
  # repository configuration gap and not a fault in the change under review —
  # hence continue-on-error, so it reports rather than blocks. Remove that line
  # once the setting is enabled and this becomes a real gate.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  release:
    name: Signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KHIZANA_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/khizana.jks"

      - name: Build signed release APK
        env:
          KHIZANA_KEYSTORE_FILE: ${{ runner.temp }}/khizana.jks
          KHIZANA_KEYSTORE_PASSWORD: ${{ secrets.KHIZANA_KEYSTORE_PASSWORD }}
          KHIZANA_KEY_ALIAS: ${{ secrets.KHIZANA_KEY_ALIAS }}
          KHIZANA_KEY_PASSWORD: ${{ secrets.KHIZANA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
