name: Dependency submission

# Publishes the resolved Gradle dependency graph for the default branch.
#
# This is what gives `dependency-review` in build.yml something to compare a
# pull request against. GitHub's dependency graph reads Maven's pom.xml
# statically but does not parse Gradle build files at all — Gradle reaches the
# graph only through the dependency submission API — and this project declares
# everything through a version catalog (gradle/libs.versions.toml) that no
# static parser would resolve anyway. Without this job the review compares two
# empty graphs and passes having examined nothing.
#
# Main only, and on push only: the snapshot describes what the default branch
# depends on, and that is the baseline a PR is diffed against. Running it on a
# pull request would submit the PR's own dependencies as the baseline, which
# would compare a branch against itself.
#
# It needs the dependency graph enabled for the account that owns this
# repository (https://github.com/settings/security_analysis) — without it the
# submission API rejects the snapshot and this job fails. It is deliberately
# not marked continue-on-error: unlike the review, a failure here is about this
# repository's own configuration and should be visible rather than absorbed,
# and it cannot block a pull request because it never runs on one.

on:
  push:
    branches: [main]

permissions:
  # Writing the dependency snapshot is a write to the repository's graph.
  contents: write

jobs:
  dependency-submission:
    name: Submit Gradle dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Same reasoning as in build.yml: the wrapper JAR is a binary committed to
      # the repository and this job executes it, so it is verified against
      # Gradle's published checksums first.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Resolves every configuration and submits the result. The Android SDK is
      # preinstalled on the runner, which AGP needs to configure the project at
      # all.
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v4
