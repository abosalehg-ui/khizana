<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="خِزانة — Khizana app icon">
  <title>خِزانة — Khizana</title>

  <defs>
    <!-- خلفية خشبية دافئة -->
    <linearGradient id="wood" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%"   stop-color="#7A4E28"/>
      <stop offset="45%"  stop-color="#6B4423"/>
      <stop offset="100%" stop-color="#3E2A1B"/>
    </linearGradient>

    <!-- ذهبي بلمعة -->
    <linearGradient id="gold" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%"   stop-color="#E3C567"/>
      <stop offset="50%"  stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#9C7A18"/>
    </linearGradient>

    <linearGradient id="goldPlank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E3C567"/>
      <stop offset="35%"  stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8A6B14"/>
    </linearGradient>

    <!-- إضاءة علوية ناعمة -->
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.7">
      <stop offset="0%"   stop-color="#E3C567" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E3C567" stop-opacity="0"/>
    </radialGradient>

    <!-- عمق داخل الخزانة -->
    <linearGradient id="cavity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2A1C11"/>
      <stop offset="100%" stop-color="#4A3220"/>
    </linearGradient>

    <!-- نسيج الخشب -->
    <pattern id="grain" width="34" height="512" patternUnits="userSpaceOnUse">
      <rect width="34" height="512" fill="none"/>
      <path d="M6 0 V512" stroke="#000" stroke-opacity="0.07" stroke-width="2"/>
      <path d="M19 0 V512" stroke="#FFF" stroke-opacity="0.04" stroke-width="1"/>
      <path d="M27 0 V512" stroke="#000" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <!-- قناع القوس الداخلي -->
    <clipPath id="archClip">
      <path d="M126 424 L126 214 Q126 128 256 74 Q386 128 386 214 L386 424 Z"/>
    </clipPath>
  </defs>

  <!-- الخلفية -->
  <rect width="512" height="512" rx="112" fill="url(#wood)"/>
  <rect width="512" height="512" rx="112" fill="url(#grain)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- تجويف الخزانة -->
  <path d="M126 424 L126 214 Q126 128 256 74 Q386 128 386 214 L386 424 Z" fill="url(#cavity)"/>

  <g clip-path="url(#archClip)">
    <!-- الرف العلوي: كتب -->
    <g>
      <rect x="146" y="200" width="22" height="54" rx="3" fill="#F5EBDA"/>
      <rect x="172" y="194" width="18" height="60" rx="3" fill="#C9A227"/>
      <rect x="194" y="204" width="26" height="50" rx="3" fill="#E8D8B4"/>
      <rect x="224" y="196" width="20" height="58" rx="3" fill="#B4762A"/>
      <rect x="248" y="202" width="24" height="52" rx="3" fill="#F5EBDA"/>
      <rect x="276" y="192" width="18" height="62" rx="3" fill="#E3C567"/>
      <g transform="rotate(-13 322 254)">
        <rect x="302" y="200" width="20" height="54" rx="3" fill="#D8C49A"/>
      </g>
      <rect x="336" y="204" width="24" height="50" rx="3" fill="#B4762A"/>
      <rect x="364" y="198" width="18" height="56" rx="3" fill="#F5EBDA"/>
    </g>

    <!-- لوح الرف العلوي -->
    <rect x="120" y="254" width="272" height="13" rx="3" fill="url(#goldPlank)"/>
    <rect x="120" y="254" width="272" height="3" rx="1.5" fill="#F0DA9A" opacity="0.75"/>

    <!-- الرف السفلي: كتب -->
    <g>
      <rect x="146" y="306" width="20" height="52" rx="3" fill="#E3C567"/>
      <rect x="170" y="312" width="26" height="46" rx="3" fill="#F5EBDA"/>
      <rect x="200" y="304" width="18" height="54" rx="3" fill="#B4762A"/>
      <rect x="222" y="310" width="22" height="48" rx="3" fill="#E8D8B4"/>
      <rect x="248" y="302" width="24" height="56" rx="3" fill="#C9A227"/>
      <rect x="276" y="312" width="18" height="46" rx="3" fill="#F5EBDA"/>
      <rect x="298" y="306" width="26" height="52" rx="3" fill="#D8C49A"/>
      <rect x="328" y="310" width="20" height="48" rx="3" fill="#B4762A"/>
      <rect x="352" y="302" width="22" height="56" rx="3" fill="#F5EBDA"/>
    </g>

    <!-- لوح الرف السفلي -->
    <rect x="120" y="358" width="272" height="13" rx="3" fill="url(#goldPlank)"/>
    <rect x="120" y="358" width="272" height="3" rx="1.5" fill="#F0DA9A" opacity="0.75"/>
  </g>

  <!-- إطار القوس الذهبي -->
  <path d="M126 424 L126 214 Q126 128 256 74 Q386 128 386 214 L386 424"
        fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- قاعدة الخزانة -->
  <rect x="112" y="418" width="288" height="18" rx="6" fill="url(#goldPlank)"/>
  <rect x="112" y="418" width="288" height="4" rx="2" fill="#F0DA9A" opacity="0.6"/>

  <!-- شمعة القمة -->
  <circle cx="256" cy="60" r="9" fill="url(#gold)"/>
  <circle cx="256" cy="60" r="17" fill="#E3C567" opacity="0.18"/>
</svg>
